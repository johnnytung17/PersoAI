# Biến thể A/B: hybrid. Chỉ khác prod ở những dòng được ghi chú bên dưới.
name: hybrid
corpus: data/corpus/csdl.jsonl

retrieval:
  mode: hybrid        # BM25 + dense BGE-M3, gộp bằng Reciprocal Rank Fusion
  top_n: 20           # số ứng viên vòng 1
  rrf_k: 60

dense:
  model: BAAI/bge-m3
  device: auto        # cuda nếu có GPU, ngược lại cpu
  fp16: true
  max_length: 512
  batch_size: 8
  cache_dir: data/models   # nơi tải mô hình (đã bỏ qua trong .gitignore)

rerank:
  enabled: false      # khác prod: không re-rank
  method: heuristic   # tạm thời; thay bằng BGE-reranker-v2-m3 sau

answer:
  top_k: 5            # số đoạn đưa vào ngữ cảnh trả lời
  min_coverage: 0.5   # dưới ngưỡng thì từ chối (RAG-04)
  max_sources: 2
